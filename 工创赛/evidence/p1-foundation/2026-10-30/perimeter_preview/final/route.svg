<text x="825" y="123" font-size="20" fill="#263746" >12个动作，逐段停稳后继续</text>
<text x="825" y="191" font-size="16" fill="#1763c0" >01  前进15cm出区</text>
<text x="825" y="222" font-size="16" fill="#c97400" >02  右移15cm向场地内侧</text>
<text x="825" y="253" font-size="16" fill="#1763c0" >03  右侧前进180cm，地图向下</text>
<text x="825" y="284" font-size="16" fill="#c97400" >04  底部右移180cm，地图向左</text>
<text x="825" y="315" font-size="16" fill="#a44723" >05  顺时针90°，车头朝左</text>
<text x="825" y="346" font-size="16" fill="#a44723" >06  顺时针90°，车头朝上</text>
<text x="825" y="377" font-size="16" fill="#1763c0" >07  左侧前进180cm，地图向上</text>
<text x="825" y="408" font-size="16" fill="#a44723" >08  逆时针90°，车头朝左</text>
<text x="825" y="439" font-size="16" fill="#a44723" >09  逆时针90°，车头恢复向下</text>
<text x="825" y="470" font-size="16" fill="#00866c" >10  顶部左移180cm，地图向右</text>
<text x="825" y="501" font-size="16" fill="#8b40af" >11  后退15cm回区</text>
<text x="825" y="532" font-size="16" fill="#00866c" >12  左移15cm返回起始中心并停车</text>
<text x="825" y="610" font-size="16" fill="#374b60" >总平移 7.8m；累计转角 360°</text>
<text x="825" y="642" font-size="16" fill="#374b60" >几何闭合：位置及车头朝向相同</text>
<text x="825" y="674" font-size="16" fill="#a04d17" >估算轮组包络：283×254mm</text>
<text x="825" y="706" font-size="16" fill="#a04d17" >外边界最小理论余量：8.5mm</text>
<text x="825" y="738" font-size="16" fill="#a04d17" >完整整车外廓未确认；余量不是定位误差预算</text>
<text x="825" y="770" font-size="16" fill="#a04d17" >后退/组合高速/整圈调度尚未接入固件</text>
